<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Загрузка материалов · Учебная база</title>
<style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17243b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:660px;min-height:100dvh;margin:auto;background:white;padding:24px 20px}.top{display:flex;justify-content:space-between;gap:14px}a{color:#2459d3;text-decoration:none}.card{border:1px solid #e0e6ef;border-radius:18px;padding:22px;margin-top:28px;box-shadow:0 8px 28px #19346009}h1{font-size:26px;margin:0 0 12px}p{color:#63748e;line-height:1.5}label{display:block;font-weight:700;margin:20px 0 9px}input{font:inherit;width:100%;border:1px solid #d7dfeb;border-radius:13px;padding:14px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#2459d3;color:#fff;font-weight:700;width:100%;padding:14px;margin-top:18px}button:disabled{opacity:.6}.link-button{background:none;color:#2459d3;padding:0;margin:0;width:auto}.status{margin-top:14px;color:#526584}</style></head>
<body><main class="shell"><div class="top"><a href="/">← К тестам</a><button class="link-button" id="logout">Выйти</button></div><div class="card"><h1>Загрузка PDF</h1><p>Создайте для нового теста отдельный раздел. Вопросы с явно указанными правильными ответами добавятся в тест, а текст PDF станет доступен для поиска.</p><form id="upload"><label for="subject">Название раздела</label><input id="subject" required maxlength="100" placeholder="Например: Фармакология · Новая тема"><label for="pdf">PDF до 10 МБ</label><input id="pdf" type="file" accept="application/pdf,.pdf" required><button id="submit">Загрузить</button><div id="status" class="status" role="status"></div></form></div></main>
<script>document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.replace('/admin')};document.querySelector('#upload').onsubmit=async e=>{e.preventDefault();const file=document.querySelector('#pdf').files[0],status=document.querySelector('#status'),button=document.querySelector('#submit');if(file.size>10_000_000){status.textContent='Файл превышает 10 МБ';return}button.disabled=true;status.textContent='Обрабатываем PDF…';try{const pdf=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const res=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.querySelector('#subject').value,pdf})});const data=await res.json();if(res.status===403){location.replace('/admin');return}if(!res.ok)throw new Error(data.error||'Ошибка загрузки');status.textContent=`Готово: ${data.questions_added} вопросов для теста, ${data.passages_added} фрагментов для поиска.`;e.target.reset()}catch(err){status.textContent=err.message}finally{button.disabled=false}};</script></body></html>
