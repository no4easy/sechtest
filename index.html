<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тесты · учебная база</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17243b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:660px;margin:auto;min-height:100dvh;background:#fff;padding:24px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:19px;letter-spacing:-.03em}.mark{width:38px;height:38px;border-radius:12px;background:#2459d3;color:white;display:grid;place-items:center;font-size:23px}.badge{font-size:12px;color:#59708f;background:#edf3ff;padding:7px 10px;border-radius:20px}.intro h1{font-size:29px;line-height:1.12;letter-spacing:-.04em;margin:0 0 8px}.intro p{color:#62728c;line-height:1.5;margin:0 0 24px}.subject-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:0 0 24px}.subject-card{text-align:left;padding:14px;border:1px solid #dce4f0;border-radius:13px;background:#fff;color:#273d60;font-weight:700;line-height:1.3}.subject-card small{display:block;color:#73849d;font-weight:500;margin-top:4px}.subject-card.active{border-color:#2459d3;background:#edf3ff;color:#1746b4}.tabs{display:flex;background:#eef2f8;padding:4px;border-radius:14px;margin:0 0 25px}.tabs button{flex:1;border:0;background:transparent;color:#526584;border-radius:11px;padding:11px 8px;font-weight:700}.tabs button.active{background:white;color:#164bc2;box-shadow:0 2px 8px #1b325018}.panel{display:none}.panel.active{display:block}.label{display:block;font-weight:700;margin:0 0 9px;font-size:14px}input,select{width:100%;border:1px solid #d7dfeb;border-radius:13px;padding:14px;color:#17243b;background:#fff;outline:none}input:focus,select:focus{border-color:#2459d3;box-shadow:0 0 0 3px #2459d322}.field{margin-bottom:16px}.primary{border:0;background:#2459d3;color:white;border-radius:13px;padding:14px 20px;font-weight:700;width:100%;min-height:50px}.primary:disabled{opacity:.55;cursor:default}.card{border:1px solid #e0e6ef;border-radius:18px;padding:20px;margin-top:22px;background:#fff;box-shadow:0 8px 28px #19346009}.muted{color:#63748e}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#3361be;margin-bottom:12px}.answer{font-size:18px;line-height:1.48;white-space:pre-wrap}.question{font-size:21px;font-weight:750;line-height:1.35;margin:0 0 18px}.option{width:100%;text-align:left;border:1px solid #dce4f0;background:white;padding:14px;border-radius:13px;margin:0 0 10px;line-height:1.45}.option:hover{border-color:#779be8}.option.correct{border-color:#29a377;background:#eaf9f2}.option.wrong{border-color:#e05f66;background:#fff0f1}.option:disabled{color:#17243b}.progress{height:6px;background:#e9eef6;border-radius:10px;overflow:hidden;margin:0 0 20px}.progress i{display:block;height:100%;background:#2459d3;transition:width .2s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:14px}.secondary{background:#edf3ff;color:#2459d3;border:0;padding:12px 16px;border-radius:11px;font-weight:700}.empty{border:1px dashed #ccd8ea;border-radius:18px;padding:24px;color:#62728c;line-height:1.5}.admin-link{margin-top:36px;color:#73849d;border:0;background:none;padding:8px 0;font-size:13px}.status{margin-top:13px;line-height:1.5;font-size:14px;color:#526584}.error{color:#bc3945}.hide{display:none!important}@media(max-width:420px){.shell{padding:20px 16px 90px}.intro h1{font-size:26px}.subject-list{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><span class="mark">✓</span> Учебная база</div><span class="badge">Для вуза</span></div><div class="intro"><h1>Вопросы и тесты</h1><p>Выберите раздел, затем найдите ответ или проверьте себя.</p></div><div id="subjects" class="subject-list" aria-label="Разделы тестов"></div><nav class="tabs" aria-label="Режим"><button class="active" data-tab="search">Поиск</button><button data-tab="quiz">Тест</button></nav><section id="search" class="panel active"><form id="search-form"><label class="label" for="query">Ваш вопрос</label><div class="field"><input id="query" placeholder="Например: эффект стимуляции рецепторов" required minlength="3"></div><button class="primary">Найти ответ</button></form><div id="search-result"></div></section><section id="quiz" class="panel"><button class="primary" id="start">Начать тест по выбранному разделу</button><button class="secondary" style="margin-top:12px" id="mistakes-button">Ошибки раздела · 0</button><div id="quiz-area"></div></section><button class="admin-link" id="admin-toggle">Загрузить материалы · для администратора</button><section id="admin" class="panel"><div class="card"><div class="eyebrow">Загрузка PDF</div><p class="muted small">Вопросы с вариантами и явно указанным правильным ответом добавятся в тест. Текст PDF станет доступен для поиска.</p><form id="upload-form"><div class="field"><label class="label" for="token">Код администратора</label><input id="token" type="password" required autocomplete="off"></div><div class="field"><label class="label" for="upload-subject">Название раздела</label><input id="upload-subject" required placeholder="Например: Фармакология · Другая тема"></div><div class="field"><label class="label" for="pdf">PDF до 10 МБ</label><input id="pdf" type="file" accept="application/pdf,.pdf" required></div><button class="primary">Загрузить</button><div id="upload-status" class="status" role="status"></div></form></div></section></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let questions=[],index=0,score=0,locked=false,selectedSubject='',quizSubject='',retryMode=false,sessionMistakes=[];
async function api(path,body,headers={}){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...headers},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка');return data}
function tab(id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#admin-toggle').onclick=()=>{const open=$('#admin').classList.contains('active');tab(open?'search':'admin');$('#admin-toggle').textContent=open?'Загрузить материалы · для администратора':'Вернуться к поиску'};
async function subjects(){const data=await api('/api/subjects');const wrap=$('#subjects');wrap.innerHTML='';if(!data.subjects.length){wrap.innerHTML='<div class="empty">Пока нет загруженных тестов.</div>';return}if(!data.subjects.some(s=>s.subject===selectedSubject))selectedSubject=data.subjects[0].subject;for(const s of data.subjects){const b=document.createElement('button');b.className='subject-card'+(s.subject===selectedSubject?' active':'');b.type='button';b.innerHTML=`${escapeHTML(s.subject)}<small>${s.count} заданий</small>`;b.onclick=()=>{selectedSubject=s.subject;document.querySelectorAll('.subject-card').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#quiz-area').innerHTML='';$('#search-result').innerHTML='';updateMistakeCount()};wrap.append(b)}updateMistakeCount()}
$('#search-form').onsubmit=async e=>{e.preventDefault();const result=$('#search-result');result.innerHTML='<div class="card muted">Ищем ответ…</div>';try{const d=await api('/api/answer',{question:$('#query').value,subject:selectedSubject});let source=d.type==='database'?`Ответ из базы · ${escapeHTML(d.subject)}`:d.type==='ai'?'Ответ ИИ · проверьте по материалам':d.type==='excerpt'?`Фрагмент материала · ${escapeHTML(d.subject)}`:'Нет совпадений';result.innerHTML=`<div class="card"><div class="eyebrow">${source}</div><div class="answer">${escapeHTML(d.answer)}</div>${d.type==='database'?`<p class="muted small">Найденный вопрос: ${escapeHTML(d.question)}</p>`:''}</div>`}catch(err){result.innerHTML=`<div class="card error">${escapeHTML(err.message)}</div>`}};
function mistakeKey(subject){return 'study-mistakes-v1:'+subject}
function getMistakes(subject=selectedSubject){try{const items=JSON.parse(localStorage.getItem(mistakeKey(subject))||'[]');return Array.isArray(items)?items.filter(x=>x&&x.id&&x.subject===subject&&Array.isArray(x.options)):[]}catch{return []}}
function saveMistakes(subject,items){try{localStorage.setItem(mistakeKey(subject),JSON.stringify(items));updateMistakeCount()}catch{$('#quiz-area').insertAdjacentHTML('beforeend','<p class="status error">Не удалось сохранить ошибки на устройстве.</p>')}}
function updateMistakeCount(){$('#mistakes-button').textContent=`Ошибки раздела · ${getMistakes().length}`}
function addMistake(q,chosen,correct,explanation){const items=getMistakes(q.subject).filter(x=>x.id!==q.id);items.push({...q,chosen,correct,explanation});saveMistakes(q.subject,items);if(!sessionMistakes.some(x=>x.id===q.id))sessionMistakes.push(q.id)}
function clearMistake(q){if(!retryMode)return;saveMistakes(q.subject,getMistakes(q.subject).filter(x=>x.id!==q.id))}
function mistakeCard(m){const selected=m.chosen===null?'Требует повторения':m.options[m.chosen]||'Нет ответа';const correct=m.options[m.correct]||m.explanation||'Эталонный ответ';return `<div class="card"><div class="eyebrow">Вопрос из раздела</div><p class="question">${escapeHTML(m.question)}</p><p class="small error">Ваш ответ: ${escapeHTML(selected)}</p><p class="small">Правильный ответ: ${escapeHTML(correct)}</p></div>`}
function showMistakes(){const items=getMistakes(),area=$('#quiz-area');area.innerHTML=items.length?`<div class="card"><div class="eyebrow">Ошибки · ${escapeHTML(selectedSubject)}</div><p class="muted small">Сохранены на этом устройстве. Правильный ответ при повторении удалит вопрос из списка.</p><button class="primary" id="retry">Перерешать ошибки (${items.length})</button></div>${items.map(mistakeCard).join('')}`:'<div class="empty" style="margin-top:22px">В этом разделе ошибок пока нет.</div>';if(items.length)$('#retry').onclick=()=>startRetry(items)}
$('#mistakes-button').onclick=showMistakes;
function startRetry(items){quizSubject=selectedSubject;questions=items.map(({chosen,correct,explanation,...q})=>q);index=0;score=0;retryMode=true;sessionMistakes=[];showQuestion()}
$('#start').onclick=async()=>{const area=$('#quiz-area'),subject=selectedSubject;area.innerHTML='<div class="card muted">Загружаем вопросы…</div>';try{const loaded=(await api('/api/questions?subject='+encodeURIComponent(subject))).questions;if(subject!==selectedSubject)return;questions=loaded;quizSubject=subject;index=0;score=0;retryMode=false;sessionMistakes=[];if(!questions.length){area.innerHTML='<div class="empty">В этом разделе пока нет вопросов с отмеченными правильными ответами. Администратор может загрузить PDF с тестами.</div>';return}showQuestion()}catch(err){area.innerHTML=`<div class="card error">${escapeHTML(err.message)}</div>`}};
function showQuestion(){locked=false;const q=questions[index],area=$('#quiz-area');area.innerHTML=`<div class="card"><div class="row muted small"><span>${escapeHTML(quizSubject)}${retryMode?' · ошибки':''}</span><span>${index+1} / ${questions.length}</span></div><div class="progress"><i style="width:${index/questions.length*100}%"></i></div><p class="question">${escapeHTML(q.question)}</p><div id="options"></div><div id="feedback" class="status"></div><button id="next" class="primary hide">${index===questions.length-1?'Показать результат':'Следующий вопрос'}</button></div>`;if(q.kind==='single'){q.options.forEach((option,n)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(1040+n)+'. '+option;b.onclick=()=>choose(n);$('#options').append(b)})}else{$('#options').innerHTML='<button class="secondary" id="reveal">Показать эталонный ответ</button>';$('#reveal').onclick=reveal}$('#next').onclick=()=>{index++;if(index<questions.length)showQuestion();else showResult()}}
function showResult(){const remaining=getMistakes(quizSubject).filter(x=>sessionMistakes.includes(x.id));$('#quiz-area').innerHTML=`<div class="card"><div class="eyebrow">${retryMode?'Повторение ошибок':'Результат теста'} · ${escapeHTML(quizSubject)}</div><p class="question">${score} из ${questions.length}</p><p class="muted small">Ошибок в этом проходе: ${sessionMistakes.length}. ${retryMode?'Верно решённые вопросы удалены из списка ошибок.':'Задания с эталонным ответом оцениваются вами самостоятельно.'}</p>${remaining.length?'<button class="secondary" id="review-session">Посмотреть ошибки этого прохода</button>':''}<button class="secondary" id="review-all" style="margin-top:10px">Ошибки раздела · ${getMistakes(quizSubject).length}</button></div>`;if(remaining.length)$('#review-session').onclick=()=>{const items=getMistakes(quizSubject).filter(x=>sessionMistakes.includes(x.id));$('#quiz-area').innerHTML=`<div class="card"><div class="eyebrow">Ошибки этого прохода</div><button class="primary" id="retry-session">Перерешать эти вопросы (${items.length})</button></div>${items.map(mistakeCard).join('')}`;$('#retry-session').onclick=()=>startRetry(items)};$('#review-all').onclick=showMistakes}
async function reveal(){if(locked)return;locked=true;const q=questions[index];try{const r=await api('/api/check',{id:q.id,answer:null});$('#options').innerHTML=`<div class="answer">${escapeHTML(r.explanation)}</div><div class="row" style="margin-top:18px"><button class="secondary" id="repeat">Пока не знаю</button><button class="secondary" id="know">Знаю</button></div>`;$('#repeat').onclick=()=>{addMistake(q,null,r.answer,r.explanation);$('#next').click()};$('#know').onclick=()=>{score++;clearMistake(q);$('#next').click()}}catch(err){locked=false;$('#feedback').textContent=err.message}}
async function choose(n){if(locked)return;locked=true;const q=questions[index];try{const r=await api('/api/check',{id:q.id,answer:n});if(r.correct){score++;clearMistake(q)}else addMistake(q,n,r.answer,r.explanation);document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===r.answer)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});$('#feedback').textContent=r.correct?'Верно':'Правильный ответ выделен зелёным';$('#next').classList.remove('hide')}catch(err){locked=false;$('#feedback').textContent=err.message}}
$('#upload-form').onsubmit=async e=>{e.preventDefault();const file=$('#pdf').files[0],status=$('#upload-status');if(file.size>10_000_000){status.textContent='Файл превышает 10 МБ';return}status.textContent='Обрабатываем PDF…';try{const pdf=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const d=await api('/api/admin/upload',{subject:$('#upload-subject').value,pdf},{'X-Admin-Token':$('#token').value});status.textContent=`Готово: ${d.questions_added} вопросов для теста, ${d.passages_added} фрагментов для поиска.`;await subjects()}catch(err){status.innerHTML=`<span class="error">${escapeHTML(err.message)}</span>`}};subjects().catch(()=>{});
</script></body></html>
