<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Вход администратора · Учебная база</title>
<style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17243b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:660px;min-height:100dvh;margin:auto;background:white;padding:24px 20px}a{color:#2459d3;text-decoration:none}.card{border:1px solid #e0e6ef;border-radius:18px;padding:22px;margin-top:28px;box-shadow:0 8px 28px #19346009}h1{font-size:26px;margin:0 0 12px}p{color:#63748e;line-height:1.5}label{display:block;font-weight:700;margin:24px 0 9px}input{font:inherit;width:100%;border:1px solid #d7dfeb;border-radius:13px;padding:14px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#2459d3;color:#fff;font-weight:700;width:100%;padding:14px;margin-top:18px}button:disabled{opacity:.6}.status{margin-top:14px;color:#bc3945}</style></head>
<body><main class="shell"><a href="/">← К тестам</a><div class="card"><h1>Вход администратора</h1><p>Загрузка новых материалов доступна после входа.</p><form id="login"><label for="token">Код администратора</label><input id="token" type="password" autocomplete="off" required><button>Войти</button><div id="status" class="status" role="status"></div></form></div></main>
<script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button'),status=document.querySelector('#status'),input=document.querySelector('#token');button.disabled=true;status.textContent='Проверяем код…';try{const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:input.value})});input.value='';const data=await res.json();if(!res.ok)throw new Error(data.error||'Не удалось войти');location.replace('/admin')}catch(err){status.textContent=err.message;button.disabled=false}};</script></body></html>
